    kw: "ask olake olack olake docs documentation assistant hackathon hacktoberfest iceberg fusion ingestion tf-idf tfidf retrieval vercel widget fastapi post ask api"
    text: "Ask OLake is a Python and FastAPI assistant over the OLake data-ingestion documentation, built at the Hacktoberfest Hack Day Bengaluru x OLake hackathon. It answers setup, sync and Iceberg table-maintenance questions from a downloaded snapshot of 121 documentation pages (698 passages) using TF-IDF retrieval, with relevance and evidence checks to reduce unsupported answers, and shows source links. By default it quotes the documentation text; an optional LLM mode checks quoted text against the retrieved passages. It has a public POST /ask API and a compact, draggable chat widget, deployed on Vercel. The answer checks are imperfect, so the sources are worth opening. It only covers OLake documentation."
    links: [olake]
  - id: zeroqueue
    sec: "Projects"
    kw: "zeroqueue zero queue gift card support copilot hackathon moss rag ocr intercom docker render pytest voucher handoff teammate"
    text: "ZeroQueue is an AI gift-card support copilot that I co-built with a teammate at the HiDevs YC Fall 2026 \"Moss Zero-Latency Builder Sprint\". I contributed the Python and FastAPI backend with a RAG pipeline over a support knowledge base of 100 brands indexed in Moss, returning cited answers with a live confidence score and retrieval-latency tracking. It supports voucher screenshot upload with Tesseract OCR and clarifying questions for incomplete requests, and hands over to a human through the Intercom REST API. It is one Docker container on Render, with 64 pytest tests run on every push via GitHub Actions. The demo is on free hosting and may take up to a minute to wake up."
    links: [zq, zqc]
